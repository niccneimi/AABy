[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aaby"
version = "0.1.0"
description = "AI-buddy backend and read-only MCP tools"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "pydantic>=2.10,<3", "mcp>=1.20,<2", "httpx>=0.28,<1", "Pillow>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
aaby = "aaby.api:main"
aaby-mcp = "aaby.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aaby --cov-report=term-missing --cov-report=xml --cov-fail-under=81"
